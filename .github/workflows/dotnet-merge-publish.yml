name: dotnet-merge-publish
on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        type: string
        default: '10.0.x'
      version-file:
        required: false
        type: string
        default: build/version.json
      skip_publish:
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  packages: write

# Supersede rapid re-pushes to the same repo (cross-repo herds still run in parallel).
concurrency:
  group: merge-publish-${{ github.repository }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.gate.outputs.run_ci }}
      run_publish: ${{ steps.gate.outputs.run_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            publish:
              - 'src/**'
              - 'codegen/**'
              - '**/*.cs'
              - '**/*.csproj'
              - '**/*.sln'
              - '**/*.slnx'
              - '**/Directory.Packages.props'
              - 'nuget.config'
              - 'NuGet.config'
              - 'global.json'
            ci:
              - 'src/**'
              - 'codegen/**'
              - 'tests/**'
              - 'samples/**'
              - 'scripts/**'
              - '**/*.cs'
              - '**/*.csproj'
              - '**/*.sln'
              - '**/*.slnx'
              - '**/Directory.Build.props'
              - '**/Directory.Build.targets'
              - '**/Directory.Packages.props'
              - 'nuget.config'
              - 'NuGet.config'
              - 'global.json'
              - 'build/**'

      - id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SKIP_PUBLISH: ${{ inputs.skip_publish }}
          FILTER_PUBLISH: ${{ steps.filter.outputs.publish }}
          FILTER_CI: ${{ steps.filter.outputs.ci }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
            if [ "$SKIP_PUBLISH" = 'true' ]; then
              echo "run_publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "run_publish=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          # Push: CI for build-impacting paths; publish only when package surface changes.
          # Directory.Build.* warning/policy tweaks → CI only (no GPR republish).
          run_ci=false
          run_publish=false
          if [ "${FILTER_CI:-}" = 'true' ] || [ "${FILTER_PUBLISH:-}" = 'true' ]; then
            run_ci=true
          fi
          if [ "${FILTER_PUBLISH:-}" = 'true' ] && [ "$SKIP_PUBLISH" != 'true' ]; then
            run_publish=true
          fi
          echo "run_ci=$run_ci" >> "$GITHUB_OUTPUT"
          echo "run_publish=$run_publish" >> "$GITHUB_OUTPUT"
          echo "detect: run_ci=$run_ci run_publish=$run_publish (ci=${FILTER_CI:-n/a} publish=${FILTER_PUBLISH:-n/a})"

  ci:
    needs: detect
    if: needs.detect.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Novolis-Platform/novolis-workflows/actions/read-version@main
        id: ver
        with:
          version-file: ${{ inputs.version-file }}
          build-number: ${{ github.run_number }}

      - uses: Novolis-Platform/novolis-workflows/actions/dotnet-build@main
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          packages_token: ${{ github.token }}
          # Fail before pack/publish: tests + doc-audit inside this action.
          run_tests: true

      - uses: Novolis-Platform/novolis-workflows/actions/dotnet-pack-versioned@main
        if: needs.detect.outputs.run_publish == 'true'
        with:
          package-version: ${{ steps.ver.outputs['package-version'] }}
          assembly-version: ${{ steps.ver.outputs['assembly-version'] }}
          file-version: ${{ steps.ver.outputs['file-version'] }}
          informational-version: ${{ steps.ver.outputs['package-version'] }}

      - uses: Novolis-Platform/novolis-workflows/actions/publish-github-packages@main
        if: needs.detect.outputs.run_publish == 'true'
