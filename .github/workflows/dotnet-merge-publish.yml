name: dotnet-merge-publish
on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        type: string
        default: '10.0.x'
      version-file:
        required: false
        type: string
        default: build/version.json
      skip_publish:
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Novolis-Platform/novolis-workflows/actions/read-version@main
        id: ver
        with:
          version-file: ${{ inputs.version-file }}
          build-number: ${{ github.run_number }}

      - uses: Novolis-Platform/novolis-workflows/actions/dotnet-build@main
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          packages_token: ${{ github.token }}
          # PR workflow runs tests; merge publishes all packable projects to GPR.
          run_tests: false

      - uses: Novolis-Platform/novolis-workflows/actions/dotnet-pack-versioned@main
        if: inputs.skip_publish == false
        with:
          # GPR: 3-part platform line so consumers on floating 2026.1.* (e.g. dogfooding) can restore.
          package-version: ${{ steps.ver.outputs.platform-version }}
          assembly-version: ${{ steps.ver.outputs.assembly-version }}
          file-version: ${{ steps.ver.outputs.file-version }}
          informational-version: ${{ steps.ver.outputs.package-version }}

      - uses: Novolis-Platform/novolis-workflows/actions/publish-github-packages@main
        if: inputs.skip_publish == false
