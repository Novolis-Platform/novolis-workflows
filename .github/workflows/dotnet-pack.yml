name: dotnet-pack
on:
  workflow_call:
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: $/actions/setup-dotnet
      - uses: $/actions/restore
      - uses: $/actions/build
      - uses: $/actions/pack
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/**/*.nupkg
