name: apps-release
on:
  workflow_call:
    inputs:
      app:
        description: App choice, key, or All
        type: string
        default: All

permissions:
  contents: write
  packages: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      windows_matrix: ${{ steps.matrix.outputs.windows_matrix }}
      linux_matrix: ${{ steps.matrix.outputs.linux_matrix }}
      android_matrix: ${{ steps.matrix.outputs.android_matrix }}
      release_matrix: ${{ steps.matrix.outputs.release_matrix }}
      package_version: ${{ steps.ver.outputs.package-version }}
      assembly_version: ${{ steps.ver.outputs.assembly-version }}
      file_version: ${{ steps.ver.outputs.file-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: Novolis-Platform/novolis-workflows/actions/setup-dotnet@main
        with:
          dotnet-version: 10.0.x
      - uses: Novolis-Platform/novolis-workflows/actions/read-version@main
        id: ver
      - name: Build release matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          if ! dotnet run --project tools/AppsManifest/AppsManifest.csproj --no-launch-profile -- \
            release-matrix --repo "$GITHUB_WORKSPACE" --app '${{ inputs.app }}' > /tmp/release-matrix.json; then
            echo '::error title=Release plan::release-matrix failed'
            exit 1
          fi
          echo "windows_matrix=$(jq -c '[.include[] | select(.channel == "windows-inno")]' /tmp/release-matrix.json)" >> "$GITHUB_OUTPUT"
          echo "linux_matrix=$(jq -c '[.include[] | select(.channel == "linux-tar")]' /tmp/release-matrix.json)" >> "$GITHUB_OUTPUT"
          echo "android_matrix=$(jq -c '[.include[] | select(.channel == "android-apk")]' /tmp/release-matrix.json)" >> "$GITHUB_OUTPUT"
          echo "release_matrix=$(jq -c . /tmp/release-matrix.json)" >> "$GITHUB_OUTPUT"
          {
            echo "## Release plan"
            echo ""
            echo "Version \`${{ steps.ver.outputs.package-version }}\`"
            echo ""
            echo "| Channel | App |"
            echo "| --- | --- |"
            jq -r '.include[] | "| \(.channel) | \(.key) |"' /tmp/release-matrix.json
          } >> "$GITHUB_STEP_SUMMARY"

  signing_preflight:
    name: signing preflight / ${{ matrix.key }}
    needs: plan
    if: needs.plan.outputs.android_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.android_matrix) }}
    steps:
      - name: Verify persistent signing inputs
        shell: pwsh
        env:
          SIGNING_SECRET_KEY: ${{ matrix.signing_secret_key }}
          ALLOW_ADHOC_SIGNING: ${{ matrix.allow_adhoc_signing }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets[format('{0}_KEYSTORE_BASE64', matrix.signing_secret_key)] }}
          ANDROID_KEY_ALIAS: ${{ secrets[format('{0}_KEY_ALIAS', matrix.signing_secret_key)] }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets[format('{0}_KEYSTORE_PASSWORD', matrix.signing_secret_key)] }}
          ANDROID_KEY_PASSWORD: ${{ secrets[format('{0}_KEY_PASSWORD', matrix.signing_secret_key)] }}
        run: |
          $ErrorActionPreference = 'Stop'
          $missing = [System.Collections.Generic.List[string]]::new()
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_SECRET_KEY)) {
            $missing.Add('android.signingSecretKey')
          }
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) {
            $missing.Add("${env:SIGNING_SECRET_KEY}_KEYSTORE_BASE64")
          }
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEY_ALIAS)) {
            $missing.Add("${env:SIGNING_SECRET_KEY}_KEY_ALIAS")
          }
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_PASSWORD)) {
            $missing.Add("${env:SIGNING_SECRET_KEY}_KEYSTORE_PASSWORD")
          }
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEY_PASSWORD)) {
            $missing.Add("${env:SIGNING_SECRET_KEY}_KEY_PASSWORD")
          }
          if ($missing -contains 'android.signingSecretKey') {
            throw "Android release signing inputs are not configured for ${{ matrix.key }}: $($missing -join ', ')"
          }
          $secretMissing = @($missing | Where-Object { $_ -ne 'android.signingSecretKey' })
          if ($secretMissing.Count -gt 0 -and $env:ALLOW_ADHOC_SIGNING -ne 'true') {
            throw "Android release signing inputs are not configured for ${{ matrix.key }}: $($secretMissing -join ', ')"
          }
          if ($secretMissing.Count -gt 0) {
            Write-Warning "Persistent Android signing inputs are absent for ${{ matrix.key }}; the explicitly opted-in adhoc sideload key will be generated."
          } else {
            Write-Host "Android signing inputs are configured for ${{ matrix.key }}."
          }

  windows-inno:
    name: windows-inno / ${{ matrix.key }}
    needs: [plan, signing_preflight]
    if: >-
      always() &&
      needs.plan.outputs.windows_matrix != '[]' &&
      (needs.signing_preflight.result == 'success' || needs.signing_preflight.result == 'skipped')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.windows_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: Novolis-Platform/novolis-workflows/actions/prepare-novolis-build@main
        with:
          token: ${{ github.token }}
      - uses: Novolis-Platform/novolis-workflows/actions/install-inno-setup@main
      - name: Publish ${{ matrix.key }}
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.plan.outputs.package_version }}
          ASSEMBLY_VERSION: ${{ needs.plan.outputs.assembly_version }}
          FILE_VERSION: ${{ needs.plan.outputs.file_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          "### windows-inno / ${{ matrix.key }}" | Add-Content $env:GITHUB_STEP_SUMMARY
          $json = dotnet run --project tools/AppsManifest/AppsManifest.csproj --no-launch-profile -- publish `
            --repo $env:GITHUB_WORKSPACE `
            --app '${{ matrix.key }}' `
            --channel windows-inno `
            --version $env:PACKAGE_VERSION `
            --assembly-version $env:ASSEMBLY_VERSION `
            --file-version $env:FILE_VERSION
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error title=windows-inno / ${{ matrix.key }}::Installer publish failed'
            exit $LASTEXITCODE
          }
          $item = $json | ConvertFrom-Json
          if (-not $item.installerPath) {
            Write-Host '::error title=windows-inno / ${{ matrix.key }}::No installer path was returned'
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.key }}
          path: |
            artifacts/${{ matrix.key }}/installer/*.exe
            artifacts/${{ matrix.key }}/*.zip
          if-no-files-found: error

  linux-tar:
    name: linux-tar / ${{ matrix.key }}
    needs: [plan, signing_preflight]
    if: >-
      always() &&
      needs.plan.outputs.linux_matrix != '[]' &&
      (needs.signing_preflight.result == 'success' || needs.signing_preflight.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.linux_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: Novolis-Platform/novolis-workflows/actions/prepare-novolis-build@main
        with:
          token: ${{ github.token }}
      - name: Publish ${{ matrix.key }}
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.plan.outputs.package_version }}
          ASSEMBLY_VERSION: ${{ needs.plan.outputs.assembly_version }}
          FILE_VERSION: ${{ needs.plan.outputs.file_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          "### linux-tar / ${{ matrix.key }}" | Add-Content $env:GITHUB_STEP_SUMMARY
          $json = dotnet run --project tools/AppsManifest/AppsManifest.csproj --no-launch-profile -- publish `
            --repo $env:GITHUB_WORKSPACE `
            --app '${{ matrix.key }}' `
            --channel linux-tar `
            --version $env:PACKAGE_VERSION `
            --assembly-version $env:ASSEMBLY_VERSION `
            --file-version $env:FILE_VERSION
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error title=linux-tar / ${{ matrix.key }}::Tarball publish failed'
            exit $LASTEXITCODE
          }
          $item = $json | ConvertFrom-Json
          if (-not $item.tarPath) {
            Write-Host '::error title=linux-tar / ${{ matrix.key }}::No tarball path was returned'
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.key }}
          path: artifacts/${{ matrix.key }}/linux/*.tar.gz
          if-no-files-found: error

  android-apk:
    name: android-apk / ${{ matrix.key }}
    needs: [plan, signing_preflight]
    if: >-
      always() &&
      needs.plan.outputs.android_matrix != '[]' &&
      needs.signing_preflight.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.android_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: Novolis-Platform/novolis-workflows/actions/prepare-novolis-build@main
        with:
          token: ${{ github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android workload
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.stack }}" = "maui" ]; then
            workload=(dotnet workload install maui-android)
          else
            workload=(dotnet workload install android)
          fi
          if ! "${workload[@]}"; then
            echo "::error title=android-apk / ${{ matrix.key }}::Android workload install failed"
            exit 1
          fi
      - name: Publish ${{ matrix.key }}
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.plan.outputs.package_version }}
          ALLOW_ADHOC_SIGNING: ${{ matrix.allow_adhoc_signing }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets[format('{0}_KEYSTORE_BASE64', matrix.signing_secret_key)] }}
          ANDROID_KEY_ALIAS: ${{ secrets[format('{0}_KEY_ALIAS', matrix.signing_secret_key)] }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets[format('{0}_KEYSTORE_PASSWORD', matrix.signing_secret_key)] }}
          ANDROID_KEY_PASSWORD: ${{ secrets[format('{0}_KEY_PASSWORD', matrix.signing_secret_key)] }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          "### android-apk / ${{ matrix.key }}" | Add-Content $env:GITHUB_STEP_SUMMARY
          . ./scripts/Publish-NovolisApp.ps1
          $keyStore = Join-Path $env:RUNNER_TEMP 'novolis-android.keystore'
          $hasKey = $env:ANDROID_KEYSTORE_BASE64 -and $env:ANDROID_KEY_ALIAS -and $env:ANDROID_KEYSTORE_PASSWORD -and $env:ANDROID_KEY_PASSWORD
          if (-not $hasKey -and $env:ALLOW_ADHOC_SIGNING -ne 'true') {
            Write-Host '::error title=android-apk / ${{ matrix.key }}::Signing secrets for ${{ matrix.signing_secret_key }} are not set'
            exit 1
          }
          if ($hasKey) {
            [IO.File]::WriteAllBytes($keyStore, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
            $item = Publish-NovolisAndroidApk -RepoRoot $env:GITHUB_WORKSPACE -AppKey '${{ matrix.key }}' -PackageVersion $env:PACKAGE_VERSION -RunNumber ([int]$env:RUN_NUMBER) -KeystorePath $keyStore -KeyAlias $env:ANDROID_KEY_ALIAS -KeystorePassword $env:ANDROID_KEYSTORE_PASSWORD -KeyPassword $env:ANDROID_KEY_PASSWORD
          } else {
            Write-Warning "Publishing explicitly opted-in adhoc sideload APK for ${{ matrix.key }}. This certificate is not upgrade-safe."
            $item = Publish-NovolisAndroidApk -RepoRoot $env:GITHUB_WORKSPACE -AppKey '${{ matrix.key }}' -PackageVersion $env:PACKAGE_VERSION -RunNumber ([int]$env:RUN_NUMBER)
          }
          if (-not $item) {
            Write-Host '::error title=android-apk / ${{ matrix.key }}::APK publish failed'
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.key }}
          path: artifacts/${{ matrix.key }}/android/*.apk
          if-no-files-found: error

  validate_release:
    name: Validate release artifacts
    needs: [plan, signing_preflight, windows-inno, linux-tar, android-apk]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      (needs.signing_preflight.result == 'success' || needs.signing_preflight.result == 'skipped') &&
      (needs.windows-inno.result == 'success' || needs.windows-inno.result == 'skipped') &&
      (needs.linux-tar.result == 'success' || needs.linux-tar.result == 'skipped') &&
      (needs.android-apk.result == 'success' || needs.android-apk.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/download
      - name: Verify every declared artifact is present
        shell: pwsh
        env:
          RELEASE_MATRIX: ${{ needs.plan.outputs.release_matrix }}
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = $env:RELEASE_MATRIX | ConvertFrom-Json
          $rows = @($metadata.include)
          if ($rows.Count -eq 0) {
            throw 'Release matrix contains no applications.'
          }

          $source = Join-Path $env:GITHUB_WORKSPACE 'artifacts/download'
          $assets = @(
            Get-ChildItem -LiteralPath $source -Recurse -File |
              Where-Object {
                $_.Extension -in @('.zip', '.exe', '.apk') -or
                $_.Name.EndsWith('.tar.gz', [StringComparison]::OrdinalIgnoreCase)
              }
          )
          if ($assets.Count -eq 0) {
            throw "No release assets were downloaded under $source."
          }

          $used = [System.Collections.Generic.HashSet[string]]::new(
            [StringComparer]::OrdinalIgnoreCase)
          $expected = 0
          foreach ($row in $rows) {
            $prefixes = @(
              [string]$row.artifact_prefix
              [string]$row.key
              [string]$row.setup_base
              [string]$row.linux_exe_name
              [IO.Path]::GetFileNameWithoutExtension([string]$row.exe_name)
            ) |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              Select-Object -Unique

            foreach ($kind in @($row.declared_update_artifacts)) {
              $extension = switch ([string]$kind) {
                'windowsInstaller' { '.exe' }
                'windowsPortable' { '.zip' }
                'linuxTarGz' { '.tar.gz' }
                'androidApk' { '.apk' }
                default { throw "Unsupported update artifact kind: $kind" }
              }

              $matches = @(
                $assets | Where-Object {
                  if ($used.Contains($_.FullName)) {
                    return $false
                  }
                  $name = $_.Name
                  $extensionMatches = if ($extension -eq '.tar.gz') {
                    $name.EndsWith($extension, [StringComparison]::OrdinalIgnoreCase)
                  }
                  else {
                    $_.Extension.Equals($extension, [StringComparison]::OrdinalIgnoreCase)
                  }
                  $prefixMatches = @(
                    $prefixes | Where-Object {
                      $name.StartsWith(
                        [string]$_,
                        [StringComparison]::OrdinalIgnoreCase) -or
                      $name.Contains(
                        [string]$_,
                        [StringComparison]::OrdinalIgnoreCase)
                    }
                  )
                  return $extensionMatches -and $prefixMatches.Count -gt 0
                }
              )
              if ($matches.Count -ne 1) {
                $found = ($matches | ForEach-Object Name) -join ', '
                throw "Expected one $kind asset for $($row.key), found $($matches.Count): $found"
              }
              if (-not $used.Add($matches[0].FullName)) {
                throw "Release asset was matched more than once: $($matches[0].Name)"
              }
              $expected++
            }
          }

          if ($used.Count -ne $assets.Count) {
            $unexpected = ($assets |
              Where-Object { -not $used.Contains($_.FullName) } |
              ForEach-Object Name) -join ', '
            throw "Downloaded release contains unaccounted assets: $unexpected"
          }
          Write-Host "Validated $expected declared release assets for $($rows.Count) application-channel rows."

  publish-release:
    name: Publish release
    needs: [plan, signing_preflight, windows-inno, linux-tar, android-apk, validate_release]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.validate_release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/download
      - uses: Novolis-Platform/novolis-workflows/actions/publish-built-release@main
        with:
          tag: v${{ needs.plan.outputs.package_version }}
          title: v${{ needs.plan.outputs.package_version }}
          notes: Release for ${{ inputs.app }}. Channels declared in build/apps.json.
          keep: '5'
          metadata-json: ${{ needs.plan.outputs.release_matrix }}

  result:
    name: Result
    needs: [plan, signing_preflight, windows-inno, linux-tar, android-apk, validate_release, publish-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: Novolis-Platform/novolis-workflows/actions/workflow-result@main
        with:
          title: App release
          jobs: |
            plan=${{ needs.plan.result }}
            signing-preflight=${{ needs.signing_preflight.result }}
            windows-inno=${{ needs.windows-inno.result }}
            linux-tar=${{ needs.linux-tar.result }}
            android-apk=${{ needs.android-apk.result }}
            validate-release=${{ needs.validate_release.result }}
            publish=${{ needs.publish-release.result }}
      - uses: Novolis-Platform/novolis-workflows/actions/dispatch-org-landing@main
        if: always()
        with:
          token: ${{ secrets.NOVOLIS_LANDING_TOKEN != '' && secrets.NOVOLIS_LANDING_TOKEN || secrets.NOVOLIS_GPR_TOKEN }}
