name: dotnet-pull-request
on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        type: string
        default: '10.0.x'
      solution:
        description: Optional solution path (e.g. Novolis.Dogfooding.slnx)
        required: false
        type: string
        default: ''
      run_tests:
        required: false
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Novolis-Platform/novolis-workflows/actions/dotnet-build@main
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          solution: ${{ inputs.solution }}
          run_tests: ${{ inputs.run_tests }}
