name: dotnet-release-publish
on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        type: string
        default: '10.0.x'
      version-file:
        required: false
        type: string
        default: build/version.json
    outputs:
      packed:
        description: True when packages were packed for the caller to push to nuget.org
        value: ${{ jobs.release.outputs.packed }}
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      packed: ${{ steps.packed.outputs.ok }}
    steps:
      - uses: actions/checkout@v4

      - uses: $/actions/resolve-release-version
        id: tag
        with:
          version-file: ${{ inputs.version-file }}

      - uses: $/actions/read-version
        id: ver
        with:
          version-file: ${{ inputs.version-file }}
          build-number: ${{ github.run_number }}

      - uses: $/actions/dotnet-build
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          packages_token: ${{ github.token }}
          run_tests: false

      - uses: $/actions/dotnet-pack-versioned
        with:
          package-version: ${{ steps.ver.outputs['package-version'] }}
          assembly-version: ${{ steps.ver.outputs['assembly-version'] }}
          file-version: ${{ steps.ver.outputs['file-version'] }}
          informational-version: ${{ steps.ver.outputs['package-version'] }}

      - uses: $/actions/publish-github-packages

      - uses: $/actions/upload-release-packages

      - id: packed
        shell: bash
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
