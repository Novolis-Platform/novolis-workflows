name: dotnet-release-publish
on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        type: string
        default: '10.0.x'
      version-file:
        required: false
        type: string
        default: build/version.json
    secrets:
      NUGET_API_KEY:
        required: true
permissions:
  contents: read
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Novolis-Platform/novolis-workflows/actions/resolve-release-version@main
        id: tag
        with:
          version-file: ${{ inputs.version-file }}

      - uses: Novolis-Platform/novolis-workflows/actions/read-version@main
        id: ver
        with:
          version-file: ${{ inputs.version-file }}
          build-number: ${{ github.run_number }}
          git-sha: ${{ github.sha }}

      - uses: Novolis-Platform/novolis-workflows/actions/dotnet-build@main
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          packages_token: ${{ github.token }}
          run_tests: false

      - uses: Novolis-Platform/novolis-workflows/actions/dotnet-pack-versioned@main
        with:
          package-version: ${{ steps.ver.outputs.package-version }}
          assembly-version: ${{ steps.ver.outputs.assembly-version }}
          file-version: ${{ steps.ver.outputs.file-version }}
          informational-version: ${{ steps.ver.outputs.informational-version }}

      - uses: Novolis-Platform/novolis-workflows/actions/publish-nuget-org@main
        with:
          api_key: ${{ secrets.NUGET_API_KEY }}

      - uses: Novolis-Platform/novolis-workflows/actions/upload-release-packages@main
