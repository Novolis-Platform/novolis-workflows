name: maui-release

on:
  workflow_call:
    inputs:
      project:
        description: MAUI project path
        required: true
        type: string
      artifact-prefix:
        description: Release asset prefix
        required: true
        type: string
      release-tag:
        description: Explicit GitHub Release tag. Defaults to the triggering ref name.
        required: false
        type: string
        default: ''
      dotnet-version:
        required: false
        type: string
        default: '10.0.x'
      android-framework:
        required: false
        type: string
        default: 'net10.0-android'
      windows-framework:
        required: false
        type: string
        default: 'net10.0-windows10.0.19041.0'
      windows-runtime-identifier:
        required: false
        type: string
        default: 'win-x64'
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: write
  packages: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Novolis-Platform/novolis-workflows/actions/setup-dotnet@main
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - uses: Novolis-Platform/novolis-workflows/actions/authenticate-github-packages@main
      - run: dotnet workload install maui-android
      - name: Publish installable APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          key_store="$RUNNER_TEMP/novolis-android.keystore"

          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_store"
            key_alias="$ANDROID_KEY_ALIAS"
            store_pass="$ANDROID_KEYSTORE_PASSWORD"
            key_pass="$ANDROID_KEY_PASSWORD"
            echo "Using configured Android release signing key."
          else
            key_alias="novolis-adhoc"
            store_pass="novolis-adhoc-release"
            key_pass="$store_pass"
            keytool -genkeypair \
              -keystore "$key_store" \
              -alias "$key_alias" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$store_pass" \
              -keypass "$key_pass" \
              -dname "CN=Novolis Ad Hoc Release,O=Novolis,C=NO"
            echo "::warning::No persistent Android signing key configured. This APK is installable, but future releases need the same key for in-place upgrades."
          fi

          dotnet publish "${{ inputs.project }}" \
            -f "${{ inputs.android-framework }}" \
            -c Release \
            -p:NovolisMauiTargetFrameworks="${{ inputs.android-framework }}" \
            -p:AndroidPackageFormats=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$key_store" \
            -p:AndroidSigningKeyAlias="$key_alias" \
            -p:AndroidSigningStorePass="$store_pass" \
            -p:AndroidSigningKeyPass="$key_pass"

          apk="$(find . -type f -name '*-Signed.apk' -path '*/bin/Release/*' | head -n 1)"
          test -n "$apk"
          cp "$apk" "artifacts/${{ inputs.artifact-prefix }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: artifacts/${{ inputs.artifact-prefix }}-android.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Novolis-Platform/novolis-workflows/actions/setup-dotnet@main
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - uses: Novolis-Platform/novolis-workflows/actions/authenticate-github-packages@main
      - name: Install Windows workload
        shell: pwsh
        run: dotnet workload install maui-windows
      - name: Publish self-contained single-file EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          dotnet publish "${{ inputs.project }}" `
            -f "${{ inputs.windows-framework }}" `
            -c Release `
            -p:NovolisMauiTargetFrameworks="${{ inputs.windows-framework }}" `
            -p:RuntimeIdentifierOverride="${{ inputs.windows-runtime-identifier }}" `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:SelfContained=true `
            -p:EnableMsixTooling=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=false

          $exe = Get-ChildItem -Recurse -Path . -Filter "$([IO.Path]::GetFileNameWithoutExtension('${{ inputs.artifact-prefix }}')).exe" |
            Where-Object { $_.FullName -match '[\\/]publish[\\/]' } |
            Select-Object -First 1
          if ($null -eq $exe) {
            $exe = Get-ChildItem -Recurse -Path . -Filter *.exe |
              Where-Object { $_.FullName -match '[\\/]publish[\\/]' -and $_.Name -notmatch 'createdump|WindowsAppRuntime' } |
              Select-Object -First 1
          }
          if ($null -eq $exe) { throw 'No published application EXE produced.' }
          Copy-Item $exe.FullName "artifacts/${{ inputs.artifact-prefix }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: artifacts/${{ inputs.artifact-prefix }}.exe
          if-no-files-found: error

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: artifacts
          merge-multiple: true
      - name: Write SHA256SUMS
        shell: bash
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
      - uses: Novolis-Platform/novolis-workflows/actions/ensure-github-release@main
        with:
          tag: ${{ inputs.release-tag != '' && inputs.release-tag || github.ref_name }}
          title: ${{ inputs.release-tag != '' && inputs.release-tag || github.ref_name }}
          assets: |
            artifacts/${{ inputs.artifact-prefix }}-android.apk
            artifacts/${{ inputs.artifact-prefix }}.exe
            artifacts/SHA256SUMS
          generate-notes: 'true'
          clobber: 'true'
