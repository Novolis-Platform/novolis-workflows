name: pack
description: dotnet pack using build/version.json (delegates to read-version + dotnet-pack-versioned)
inputs:
  version:
    description: Optional override package version
    required: false
    default: ''
  version-file:
    description: Path to version.json
    required: false
    default: build/version.json
runs:
  using: composite
  steps:
    - uses: Novolis-Platform/novolis-workflows/actions/read-version@main
      id: ver
      with:
        version-file: ${{ inputs.version-file }}
        build-number: ${{ github.run_number }}

    - uses: Novolis-Platform/novolis-workflows/actions/dotnet-pack-versioned@main
      with:
        package-version: ${{ inputs.version != '' && inputs.version || steps.ver.outputs.package-version }}
        assembly-version: ${{ steps.ver.outputs.assembly-version }}
        file-version: ${{ steps.ver.outputs.file-version }}
        informational-version: ${{ steps.ver.outputs.informational-version }}
