name: publish-github-packages
description: Push .nupkg files to the GitHub Packages NuGet feed for the repository owner
inputs:
  owner:
    description: GitHub org or user (defaults to github.repository_owner)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Push packages
      shell: bash
      env:
        OWNER: ${{ inputs.owner != '' && inputs.owner || github.repository_owner }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        pkgs=(artifacts/packages/*.nupkg)
        if [ ${#pkgs[@]} -eq 0 ]; then
          echo "::error::No packages found in artifacts/packages/"
          exit 1
        fi
        source="https://nuget.pkg.github.com/${OWNER}/index.json"
        failed=0
        for pkg in "${pkgs[@]}"; do
          base="$(basename "$pkg")"
          # Skip symbol packages; GitHub Packages NuGet rejects or ignores them inconsistently.
          if [[ "$base" == *.symbols.nupkg ]] || [[ "$base" == *.snupkg ]]; then
            echo "Skipping symbols package $base"
            continue
          fi
          echo "Pushing $base to GitHub Packages (${OWNER})"
          if ! dotnet nuget push "$pkg" --source "$source" --api-key "${{ github.token }}" --skip-duplicate; then
            # Cross-repo package linkage (403) or transient auth must not abort the rest of the batch.
            echo "::warning::Failed to push $base (continuing remaining packages)"
            failed=1
          fi
        done
        if [ "$failed" -ne 0 ]; then
          echo "::error::One or more package pushes failed"
          exit 1
        fi
