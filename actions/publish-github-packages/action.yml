name: publish-github-packages
description: Push .nupkg files to the GitHub Packages NuGet feed for the repository owner
inputs:
  owner:
    description: GitHub org or user (defaults to github.repository_owner)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Push packages
      shell: bash
      env:
        OWNER: ${{ inputs.owner != '' && inputs.owner || github.repository_owner }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        pkgs=(artifacts/packages/*.nupkg)
        if [ ${#pkgs[@]} -eq 0 ]; then
          echo "::error::No packages found in artifacts/packages/"
          exit 1
        fi
        source="https://nuget.pkg.github.com/${OWNER}/index.json"
        failed=0
        for pkg in "${pkgs[@]}"; do
          base="$(basename "$pkg")"
          # Skip symbol packages; GitHub Packages NuGet rejects or ignores them inconsistently.
          if [[ "$base" == *.symbols.nupkg ]] || [[ "$base" == *.snupkg ]]; then
            echo "Skipping symbols package $base"
            continue
          fi
          echo "Pushing $base to GitHub Packages (${OWNER})"
          push_out="$(mktemp)"
          set +e
          dotnet nuget push "$pkg" --source "$source" --api-key "${{ github.token }}" --skip-duplicate >"$push_out" 2>&1
          push_rc=$?
          set -e
          cat "$push_out"
          if [ "$push_rc" -eq 0 ]; then
            rm -f "$push_out"
            continue
          fi
          # GitHub Packages often returns Conflict for duplicates even with --skip-duplicate.
          if grep -qiE 'already been pushed|Conflict|409 \(Conflict\)' "$push_out"; then
            echo "Duplicate $base — treating as success"
            rm -f "$push_out"
            continue
          fi
          echo "::warning::Failed to push $base (continuing remaining packages)"
          failed=1
          rm -f "$push_out"
        done
        if [ "$failed" -ne 0 ]; then
          echo "::error::One or more package pushes failed"
          exit 1
        fi
