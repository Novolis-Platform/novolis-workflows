name: raylib-build-test
description: Restore, build, and test Novolis.Raylib shipping libraries and unit tests
inputs:
  dotnet-version:
    required: false
    default: '10.0.x'
  packages_token:
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: Novolis-Platform/novolis-workflows/actions/setup-dotnet@main
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - uses: Novolis-Platform/novolis-workflows/actions/authenticate-github-packages@main
      with:
        token: ${{ inputs.packages_token }}

    - name: Restore, build, and test
      shell: bash
      run: |
        set -euo pipefail
        cfg=(--configfile nuget.config)
        shipping=(src/*/*.csproj)
        tests=(
          tests/Novolis.Raylib.CodeGen.Unit/Novolis.Raylib.CodeGen.Unit.csproj
          tests/Novolis.Raylib.Pipeline.Unit/Novolis.Raylib.Pipeline.Unit.csproj
          tests/Novolis.Raylib.Testing.Unit/Novolis.Raylib.Testing.Unit.csproj
          tests/Novolis.Raylib.Capture.Unit/Novolis.Raylib.Capture.Unit.csproj
        )
        for proj in "${shipping[@]}"; do
          dotnet restore "$proj" "${cfg[@]}"
        done
        for proj in "${tests[@]}"; do
          dotnet restore "$proj" "${cfg[@]}"
        done
        for proj in "${shipping[@]}"; do
          dotnet build "$proj" -c Release --no-restore
        done
        for proj in "${tests[@]}"; do
          dotnet test "$proj" -c Release --no-build
        done
