name: set-github-packages-public
description: Set published NuGet packages to public visibility on GitHub Packages
inputs:
  owner:
    description: GitHub org or user (defaults to github.repository_owner)
    required: false
    default: ''
  packages_dir:
    description: Directory containing .nupkg files just pushed
    required: false
    default: artifacts/packages
  package_type:
    description: GitHub Packages type (nuget, container, etc.)
    required: false
    default: nuget
  grant_actions_repo:
    description: Repository name to grant read Actions access (e.g. novolis-dogfooding)
    required: false
    default: novolis-dogfooding
runs:
  using: composite
  steps:
    - name: Set package visibility to public
      shell: bash
      env:
        OWNER: ${{ inputs.owner != '' && inputs.owner || github.repository_owner }}
        PKG_DIR: ${{ inputs.packages_dir }}
        PKG_TYPE: ${{ inputs.package_type }}
        GRANT_REPO: ${{ inputs.grant_actions_repo }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        pkgs=("$PKG_DIR"/*.nupkg)
        if [ ${#pkgs[@]} -eq 0 ]; then
          echo "No .nupkg files in $PKG_DIR; skipping visibility update."
          exit 0
        fi

        repo_id=""
        if [ -n "${GRANT_REPO:-}" ]; then
          repo_id=$(curl -fsSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/${GRANT_REPO}" | jq -r '.id // empty' || true)
        fi

        for pkg in "${pkgs[@]}"; do
          base=$(basename "$pkg" .nupkg)
          # Strip 2–4 part numeric version suffix (0.0.1.1, 1.2.3, etc.)
          package_id=$(echo "$base" | sed -E 's/\.[0-9]+(\.[0-9]+){1,3}$//')
          api_name=$(echo "$package_id" | tr '[:upper:]' '[:lower:]')

          echo "Setting ${package_id} (${api_name}) to public..."
          http_code=$(curl -sS -o /tmp/gpr-visibility.json -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/orgs/${OWNER}/packages/${PKG_TYPE}/${api_name}/visibility" \
            -d '{"visibility":"public"}')

          if [ "$http_code" = "204" ] || [ "$http_code" = "200" ]; then
            echo "  visibility=public (${http_code})"
          else
            echo "::warning::Could not set ${package_id} to public (HTTP ${http_code}): $(cat /tmp/gpr-visibility.json 2>/dev/null || true)"
            echo "::warning::Set org Package creation to Public and change existing packages in the org Packages UI if needed."
          fi

          if [ -n "$repo_id" ]; then
            curl -sS -o /tmp/gpr-repo.json -w "%{http_code}" \
              -X PUT \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/orgs/${OWNER}/packages/${PKG_TYPE}/${api_name}/repositories/${repo_id}" \
              -d '{"permission":"read"}' >/tmp/gpr-repo-http.txt || true
            grant_code=$(cat /tmp/gpr-repo-http.txt 2>/dev/null || echo "000")
            if [ "$grant_code" = "204" ] || [ "$grant_code" = "201" ] || [ "$grant_code" = "200" ]; then
              echo "  granted ${GRANT_REPO} read (${grant_code})"
            fi
          fi
        done
