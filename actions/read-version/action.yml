name: read-version
description: Read YEAR.MAJOR.MINOR from build/version.json; BUILD from github.run_number
inputs:
  version-file:
    description: Path to version.json
    required: false
    default: build/version.json
  build-number:
    description: CI build segment (github.run_number)
    required: false
    default: ''
outputs:
  year:
    description: YEAR segment from version.json
    value: ${{ steps.out.outputs.year }}
  major:
    description: MAJOR segment from version.json
    value: ${{ steps.out.outputs.major }}
  minor:
    description: MINOR segment from version.json
    value: ${{ steps.out.outputs.minor }}
  build:
    description: BUILD segment (run number)
    value: ${{ steps.out.outputs.build }}
  platform-version:
    description: YEAR.MAJOR.MINOR platform line
    value: ${{ steps.out.outputs['platform-version'] }}
  package-version:
    description: YEAR.MAJOR.MINOR.BUILD full package version
    value: ${{ steps.out.outputs['package-version'] }}
  assembly-version:
    description: AssemblyVersion (YEAR.MAJOR.0.0)
    value: ${{ steps.out.outputs['assembly-version'] }}
  file-version:
    description: FileVersion (YEAR.MAJOR.MINOR.BUILD)
    value: ${{ steps.out.outputs['file-version'] }}
  informational-version:
    description: InformationalVersion (defaults to full package version)
    value: ${{ steps.out.outputs['informational-version'] }}
runs:
  using: composite
  steps:
    - id: out
      shell: bash
      env:
        VERSION_FILE: ${{ inputs.version-file }}
        BUILD_NUMBER: ${{ inputs.build-number }}
      run: |
        set -euo pipefail
        if [ ! -f "$VERSION_FILE" ]; then
          echo "::error::Missing $VERSION_FILE"
          exit 1
        fi

        year=$(jq -r '(.year // .sdkYear) | tonumber' "$VERSION_FILE")
        major=$(jq -r '(.major // .apiBreak) | tonumber' "$VERSION_FILE")
        minor=$(jq -r '(.minor // .feature) | tonumber' "$VERSION_FILE")

        build_num="${BUILD_NUMBER:-}"
        if [ -z "$build_num" ]; then
          build_num="${GITHUB_RUN_NUMBER:-0}"
        fi

        platform="${year}.${major}.${minor}"
        package="${platform}.${build_num}"
        assembly="${year}.${major}.0.0"
        file="${package}"

        {
          echo "year=$year"
          echo "major=$major"
          echo "minor=$minor"
          echo "build=$build_num"
          echo "platform-version=$platform"
          echo "package-version=$package"
          echo "assembly-version=$assembly"
          echo "file-version=$file"
          echo "informational-version=$package"
        } >> "$GITHUB_OUTPUT"

        echo "Package version: $package"
