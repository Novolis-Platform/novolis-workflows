name: install-inno-setup
description: Install Inno Setup 6 via Chocolatey and resolve ISCC.exe
outputs:
  iscc-path:
    description: Absolute path to ISCC.exe
    value: ${{ steps.install.outputs.iscc-path }}
runs:
  using: composite
  steps:
    - id: install
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        choco install innosetup -y --no-progress
        if ($LASTEXITCODE -ne 0) { throw "Chocolatey failed to install Inno Setup." }

        $iscc = @(
          "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
        ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1

        if (-not $iscc) {
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1)
        }

        if (-not $iscc) {
          throw "Unable to locate ISCC.exe after installing Inno Setup."
        }

        "iscc-path=$iscc" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8NoBOM
        Write-Host "ISCC: $iscc"
