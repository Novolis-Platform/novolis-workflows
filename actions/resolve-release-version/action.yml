name: resolve-release-version
description: Validate release tag against build/version.json (vYEAR.MAJOR.MINOR or vYEAR.MAJOR.MINOR.BUILD)
inputs:
  version-file:
    description: Path to version.json
    required: false
    default: build/version.json
outputs:
  version:
    description: Full package version YEAR.MAJOR.MINOR.BUILD (BUILD from github.run_number)
    value: ${{ steps.out.outputs.version }}
runs:
  using: composite
  steps:
    - id: out
      shell: bash
      env:
        VERSION_FILE: ${{ inputs.version-file }}
      run: |
        set -euo pipefail
        TAG="${{ github.event.release.tag_name }}"
        if [ -z "$TAG" ]; then
          echo "::error::This action requires release published (missing tag_name)."
          exit 1
        fi
        TAG_VERSION="${TAG#v}"

        if [ ! -f "$VERSION_FILE" ]; then
          echo "::error::Missing $VERSION_FILE"
          exit 1
        fi

        year=$(jq -r '(.year // .sdkYear) | tonumber' "$VERSION_FILE")
        major=$(jq -r '(.major // .apiBreak) | tonumber' "$VERSION_FILE")
        minor=$(jq -r '(.minor // .feature) | tonumber' "$VERSION_FILE")
        platform="${year}.${major}.${minor}"

        build_num="${GITHUB_RUN_NUMBER:-0}"
        package="${platform}.${build_num}"

        if [ "$TAG_VERSION" = "$platform" ]; then
          echo "Release tag v${TAG_VERSION} matches platform line; packing ${package}."
        elif [ "$TAG_VERSION" = "$package" ]; then
          echo "Release tag matches full package version ${package}."
        else
          echo "::error::Release tag v${TAG_VERSION} must be v${platform} or v${package} (from $VERSION_FILE + run ${build_num})."
          exit 1
        fi

        echo "version=$package" >> "$GITHUB_OUTPUT"
