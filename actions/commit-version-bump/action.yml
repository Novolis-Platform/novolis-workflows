name: commit-version-bump
description: Commit and push .novolis/version.props after a successful publish
inputs:
  message:
    description: Commit message (use {version} for next_version placeholder)
    required: false
    default: 'chore: bump build to {version} [skip ci]'
  next_version:
    description: Version string inserted into the commit message
    required: true
runs:
  using: composite
  steps:
    - name: Commit build version bump
      continue-on-error: true
      shell: bash
      env:
        NEXT_VERSION: ${{ inputs.next_version }}
        MESSAGE_TEMPLATE: ${{ inputs.message }}
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .novolis/version.props
        if git diff --staged --quiet; then
          echo "No version file changes to commit."
          exit 0
        fi
        msg="${MESSAGE_TEMPLATE//\{version\}/$NEXT_VERSION}"
        git commit -m "$msg"
        git push || echo "::warning::Could not push version bump (branch protection?)."
