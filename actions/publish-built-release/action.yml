name: publish-built-release
description: Hash the installers built in this run and publish them as one GitHub Release, then keep the newest tags.
inputs:
  tag:
    description: Release tag, for example v2026.1.0.45
    required: true
  title:
    description: Release title
    required: true
  notes:
    description: Release notes
    required: true
  source-dir:
    description: Directory of downloaded build artifacts
    required: false
    default: artifacts/download
  staging-dir:
    description: Directory of files uploaded to the release
    required: false
    default: artifacts/release
  keep:
    description: How many newest GitHub Releases to keep
    required: false
    default: '5'
  metadata-json:
    description: Release matrix JSON used to build the signed update catalog
    required: true
runs:
  using: composite
  steps:
    - name: Publish built installers
      shell: pwsh
      env:
        TAG: ${{ inputs.tag }}
        TITLE: ${{ inputs.title }}
        NOTES: ${{ inputs.notes }}
        SOURCE_DIR: ${{ inputs.source-dir }}
        STAGING_DIR: ${{ inputs.staging-dir }}
        KEEP: ${{ inputs.keep }}
        UPDATE_METADATA_JSON: ${{ inputs.metadata-json }}
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        $ErrorActionPreference = 'Stop'
        function Resolve-WorkspacePath([string]$path) {
          if ([System.IO.Path]::IsPathRooted($path)) { return $path }
          return Join-Path $env:GITHUB_WORKSPACE $path
        }

        $source = Resolve-WorkspacePath $env:SOURCE_DIR
        $staging = Resolve-WorkspacePath $env:STAGING_DIR
        if (-not (Test-Path -LiteralPath $source)) {
          throw "Release source directory not found: $source"
        }
        New-Item -ItemType Directory -Force -Path $staging | Out-Null
        Get-ChildItem -LiteralPath $staging -File -ErrorAction SilentlyContinue |
          Remove-Item -Force

        $files = @(Get-ChildItem -LiteralPath $source -Recurse -File |
          Where-Object { $_.Extension -in '.zip', '.exe', '.apk' -or $_.Name.EndsWith('.tar.gz') })
        if ($files.Count -eq 0) {
          throw "No release files under $source"
        }

        $staged = [System.Collections.Generic.List[string]]::new()
        $names = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
        foreach ($file in $files) {
          if (-not $names.Add($file.Name)) {
            throw "Duplicate release asset basename: $($file.Name)"
          }
          $dest = Join-Path $staging $file.Name
          Copy-Item -LiteralPath $file.FullName -Destination $dest -Force
          $staged.Add($dest)
        }

        $metadata = $env:UPDATE_METADATA_JSON | ConvertFrom-Json
        $rows = @($metadata.include)
        if ($rows.Count -eq 0) {
          throw 'Update metadata contains no release rows.'
        }

        $releaseUri = "https://github.com/$env:REPO/releases/download/$env:TAG"
        $repositoryUri = "https://github.com/$env:REPO"
        $releaseTime = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ss.fffffffZ')
        $updates = [System.Collections.Generic.List[object]]::new()
        $groups = $rows | Group-Object update_app_id, update_channel
        foreach ($group in $groups) {
          $first = $group.Group[0]
          $appId = [string]$first.update_app_id
          $channel = [string]$first.update_channel
          $distribution = [string]$first.update_distribution
          if ($distribution -ne 'direct-github') {
            throw "Store-managed app cannot be published in the direct updater catalog: $appId"
          }

          $artifacts = [System.Collections.Generic.List[object]]::new()
          $declaredKinds = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($row in $group.Group) {
            foreach ($kind in @($row.declared_update_artifacts)) {
              [void]$declaredKinds.Add([string]$kind)
            }
          }
          foreach ($kind in $declaredKinds) {
            $extension = switch ($kind.ToLowerInvariant()) {
              'windowsinstaller' { '.exe' }
              'windowsportable' { '.zip' }
              'linuxtargz' { '.tar.gz' }
              'androidapk' { '.apk' }
              default { throw "Unsupported update artifact kind: $kind" }
            }
            $prefixes = @(
              $group.Group | ForEach-Object {
                @(
                  [string]$_.artifact_prefix,
                  [string]$_.key,
                  [string]$_.setup_base,
                  [string]$_.linux_exe_name,
                  [System.IO.Path]::GetFileNameWithoutExtension([string]$_.exe_name)
                )
              } | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique
            )
            $matches = @($staged | Where-Object {
              $name = Split-Path -Leaf $_
              $name.EndsWith($extension, [StringComparison]::OrdinalIgnoreCase) -and
                ($prefixes | Where-Object {
                  $name.StartsWith($_, [StringComparison]::OrdinalIgnoreCase) -or
                  $name.Contains($_, [StringComparison]::OrdinalIgnoreCase)
                }).Count -gt 0
            })
            if ($matches.Count -ne 1) {
              $found = ($matches | ForEach-Object { Split-Path -Leaf $_ }) -join ', '
              throw "Expected one $kind asset for $appId, found $($matches.Count): $found"
            }
            $path = $matches[0]
            $name = Split-Path -Leaf $path
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $length = (Get-Item -LiteralPath $path).Length
            $target = switch ($kind.ToLowerInvariant()) {
              'windowsinstaller' { [ordered]@{ platform = 'windows'; runtimeIdentifier = 'win-x64'; architecture = 'x64' } }
              'windowsportable' { [ordered]@{ platform = 'windows'; runtimeIdentifier = 'win-x64'; architecture = 'x64' } }
              'linuxtargz' { [ordered]@{ platform = 'linux'; runtimeIdentifier = 'linux-x64'; architecture = 'x64' } }
              'androidapk' { [ordered]@{ platform = 'android' } }
            }
            $contentType = switch ($kind.ToLowerInvariant()) {
              'windowsinstaller' { 'application/vnd.microsoft.portable-executable' }
              'windowsportable' { 'application/zip' }
              'linuxtargz' { 'application/gzip' }
              'androidapk' { 'application/vnd.android.package-archive' }
            }
            $artifacts.Add([ordered]@{
              name = $name
              kind = $kind
              target = $target
              downloadUri = "$releaseUri/$([Uri]::EscapeDataString($name))"
              length = $length
              sha256 = $hash
              contentType = $contentType
            })
          }

          $updates.Add([ordered]@{
            schemaVersion = 1
            appId = $appId
            displayName = [string]$first.display_name
            distributionMode = 'directGithub'
            channel = $channel
            version = ($env:TAG -replace '^v', '')
            publishedAt = $releaseTime
            provenance = [ordered]@{
              appId = $appId
              repository = if ($first.update_repository) { [string]$first.update_repository } else { $repositoryUri }
              tag = $env:TAG
              releaseUri = "https://github.com/$env:REPO/releases/tag/$env:TAG"
              commit = $env:GITHUB_SHA
            }
            artifacts = @($artifacts | Sort-Object name)
          })
        }

        $catalog = [ordered]@{
          schemaVersion = 1
          generatedAt = $releaseTime
          updates = @($updates | Sort-Object appId)
        }
        $manifestPath = Join-Path $staging 'Novolis.Update.json'
        $json = $catalog | ConvertTo-Json -Depth 20
        [System.IO.File]::WriteAllText(
          $manifestPath,
          $json + [Environment]::NewLine,
          [System.Text.UTF8Encoding]::new($false))
        $staged.Add($manifestPath)

        $manifestDocument = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
        if ($manifestDocument.schemaVersion -ne 1 -or @($manifestDocument.updates).Count -eq 0) {
          throw 'Generated Novolis.Update.json failed its catalog contract.'
        }
        $appIds = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
        foreach ($update in @($manifestDocument.updates)) {
          if (-not $appIds.Add([string]$update.appId)) {
            throw "Generated Novolis.Update.json contains duplicate app ID: $($update.appId)"
          }
          if ($update.distributionMode -ne 'directGithub') {
            throw "Generated update is not direct-github: $($update.appId)"
          }
          foreach ($uri in @(
              [string]$update.provenance.repository,
              [string]$update.provenance.releaseUri)) {
            if (-not $uri.StartsWith('https://', [StringComparison]::OrdinalIgnoreCase)) {
              throw "Generated update contains a non-HTTPS provenance URL: $uri"
            }
          }
          $artifactNames = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($artifact in @($update.artifacts)) {
            $artifactName = [string]$artifact.name
            $unsafeName = [string]::IsNullOrWhiteSpace($artifactName) -or $artifactName.IndexOf([char]47) -ge 0 -or $artifactName.IndexOf([char]92) -ge 0 -or $artifactName.Contains('..')
            if ($unsafeName) {
              throw "Generated update contains an unsafe artifact name: $artifactName"
            }
            if (-not $artifactNames.Add([string]$artifact.name)) {
              throw "Generated update contains duplicate artifact name: $($artifact.name)"
            }
            $downloadUri = [string]$artifact.downloadUri
            $sha256 = [string]$artifact.sha256
            $invalidArtifact = -not $downloadUri.StartsWith('https://', [StringComparison]::OrdinalIgnoreCase) -or [int64]$artifact.length -le 0 -or $sha256 -notmatch '^[0-9a-fA-F]{64}$'
            if ($invalidArtifact) {
              throw "Generated update contains an invalid artifact contract: $artifactName"
            }
          }
        }

        $sums = Join-Path $staging 'SHA256SUMS.txt'
        $lines = foreach ($path in $staged) {
          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          '{0}  {1}' -f $hash, (Split-Path $path -Leaf)
        }
        Set-Content -LiteralPath $sums -Value $lines -Encoding utf8NoBOM
        $staged.Add($sums)

        & gh release create $env:TAG @($staged.ToArray()) --repo $env:REPO --title $env:TITLE --notes $env:NOTES --latest
        if ($LASTEXITCODE -ne 0) {
          throw "gh release create failed with exit code $LASTEXITCODE."
        }

        $keep = [int]$env:KEEP
        $releases = gh release list --repo $env:REPO --limit 100 --json tagName,createdAt | ConvertFrom-Json
        $drop = @($releases | Sort-Object { [datetime]$_.createdAt } -Descending | Select-Object -Skip $keep)
        foreach ($release in $drop) {
          Write-Host "Deleting $($release.tagName)"
          gh release delete $release.tagName --repo $env:REPO --yes --cleanup-tag
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to delete release $($release.tagName) (exit $LASTEXITCODE)."
          }
        }
