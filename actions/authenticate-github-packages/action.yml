name: authenticate-github-packages
description: Add GitHub Packages feed; optional token for cross-repo restore (public packages work without auth)
inputs:
  token:
    description: PAT or token with read:packages for cross-repo Novolis.* restore (optional)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Configure GitHub Packages feed
      shell: bash
      env:
        GPR_URL: https://nuget.pkg.github.com/Novolis-Platform/index.json
        GPR_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        cfg=""
        for f in nuget.config NuGet.config; do
          if [ -f "$f" ]; then cfg="$f"; break; fi
        done
        if [ -z "$cfg" ]; then
          echo "No nuget.config; skipping."
          exit 0
        fi
        dotnet nuget remove source github --configfile "$cfg" >/dev/null 2>&1 || true
        if [ -n "${GPR_TOKEN:-}" ]; then
          dotnet nuget add source "$GPR_URL" \
            --name github \
            --username "x-access-token" \
            --password "$GPR_TOKEN" \
            --store-password-in-clear-text \
            --configfile "$cfg"
        else
          echo "No GPR read token; using anonymous access (public Novolis packages)."
          dotnet nuget add source "$GPR_URL" \
            --name github \
            --configfile "$cfg"
        fi
