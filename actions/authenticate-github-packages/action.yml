name: authenticate-github-packages
description: Add GitHub Packages feed authenticated with GITHUB_TOKEN (or an optional read:packages PAT)
inputs:
  token:
    description: PAT or token with read:packages; defaults to github.token when empty
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Configure GitHub Packages feed
      shell: bash
      env:
        GPR_URL: https://nuget.pkg.github.com/Novolis-Platform/index.json
      run: |
        set -euo pipefail
        cfg=""
        for f in nuget.config NuGet.config; do
          if [ -f "$f" ]; then cfg="$f"; break; fi
        done
        if [ -z "$cfg" ]; then
          echo "No nuget.config; skipping."
          exit 0
        fi
        gpr_token='${{ inputs.token }}'
        if [ -z "$gpr_token" ]; then
          gpr_token='${{ github.token }}'
        fi
        if [ -z "$gpr_token" ]; then
          echo "::error::No GitHub Packages token (set packages: read on the job, or pass inputs.token)."
          exit 1
        fi
        dotnet nuget remove source github --configfile "$cfg" >/dev/null 2>&1 || true
        dotnet nuget add source "$GPR_URL" \
          --name github \
          --username "x-access-token" \
          --password "$gpr_token" \
          --store-password-in-clear-text \
          --configfile "$cfg"
