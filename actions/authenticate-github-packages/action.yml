name: authenticate-github-packages
description: Configure GitHub Packages credentials when nuget.config is present
runs:
  using: composite
  steps:
    - name: Authenticate to GitHub Packages
      shell: bash
      run: |
        set -euo pipefail
        cfg=""
        for f in nuget.config NuGet.config; do
          if [ -f "$f" ]; then cfg="$f"; break; fi
        done
        if [ -z "$cfg" ]; then
          echo "No nuget.config; skipping GitHub Packages auth."
          exit 0
        fi
        dotnet nuget update source github \
          --username "${{ github.actor }}" \
          --password "${{ github.token }}" \
          --store-password-in-clear-text \
          --configfile "$cfg"
