name: resolve-version
description: Read package version from build/version.json (legacy output name)
outputs:
  version:
    description: YEAR.MAJOR.MINOR.BUILD
    value: ${{ steps.out.outputs.version }}
runs:
  using: composite
  steps:
    - uses: Novolis-Platform/novolis-workflows/actions/read-version@main
      id: read
      with:
        build-number: ${{ github.run_number }}
    - id: out
      shell: bash
      run: |
        echo "version=${{ steps.read.outputs['package-version'] }}" >> "$GITHUB_OUTPUT"
