name: resolve-version
description: Read stable version from build/version.json (legacy output name)
outputs:
  version:
    description: Stable SDKYEAR.APIBREAK.FEATURE
    value: ${{ steps.out.outputs.version }}
runs:
  using: composite
  steps:
    - uses: Novolis-Platform/novolis-workflows/actions/read-version@main
      id: read
    - id: out
      shell: bash
      run: |
        echo "version=${{ steps.read.outputs.stable-version }}" >> "$GITHUB_OUTPUT"
