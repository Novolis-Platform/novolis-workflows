name: verify-packages-public
description: Fail CI if published NuGet packages are not public on GitHub Packages
inputs:
  owner:
    description: GitHub org or user (defaults to github.repository_owner)
    required: false
    default: ''
  packages_dir:
    description: Directory containing .nupkg files that were pushed
    required: false
    default: artifacts/packages
  package_type:
    description: GitHub Packages type
    required: false
    default: nuget
runs:
  using: composite
  steps:
    - name: Verify package visibility is public
      shell: bash
      env:
        OWNER: ${{ inputs.owner != '' && inputs.owner || github.repository_owner }}
        PKG_DIR: ${{ inputs.packages_dir }}
        PKG_TYPE: ${{ inputs.package_type }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        pkgs=("$PKG_DIR"/*.nupkg)
        if [ ${#pkgs[@]} -eq 0 ]; then
          echo "No .nupkg files in $PKG_DIR; skipping visibility check."
          exit 0
        fi

        failed=0
        for pkg in "${pkgs[@]}"; do
          base=$(basename "$pkg" .nupkg)
          package_id=$(echo "$base" | sed -E 's/\.[0-9]+(\.[0-9]+){1,3}$//')
          api_name=$(echo "$package_id" | tr '[:upper:]' '[:lower:]')

          for name in "$api_name" "$package_id"; do
            http_code=$(curl -sS -o /tmp/gpr-get.json -w "%{http_code}" \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/${OWNER}/packages/${PKG_TYPE}/${name}")
            if [ "$http_code" = "200" ]; then
              visibility=$(jq -r '.visibility // "unknown"' /tmp/gpr-get.json)
              echo "${package_id} (${name}): visibility=${visibility}"
              if [ "$visibility" != "public" ]; then
                echo "::error::Package ${package_id} is not public. Enable org Package creation → Public only, then republish (workflow: Republish NuGet as public). See novolis-governance/docs/github-packages-org-settings.md"
                failed=1
              fi
              break
            fi
          done
        done

        exit "$failed"
