name: workflow-result
description: Write a job-result table to the run summary and annotate every failed job.
inputs:
  title:
    description: Summary heading
    required: true
  jobs:
    description: Newline-separated name=result lines from needs.<job>.result
    required: true
runs:
  using: composite
  steps:
    - name: Report job results
      shell: bash
      env:
        TITLE: ${{ inputs.title }}
        JOBS: ${{ inputs.jobs }}
      run: |
        set -euo pipefail
        {
          echo "## ${TITLE}"
          echo ""
          echo "| Job | Result |"
          echo "| --- | --- |"
        } >> "$GITHUB_STEP_SUMMARY"
        failed=0
        while IFS= read -r line || [ -n "$line" ]; do
          line="${line#"${line%%[![:space:]]*}"}"
          [ -z "$line" ] && continue
          name="${line%%=*}"
          result="${line#*=}"
          echo "| ${name} | ${result} |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" = "failure" ]; then
            echo "::error title=${name}::${name} failed"
            failed=1
          fi
        done <<< "$JOBS"
        if [ "$failed" -ne 0 ]; then
          echo "::error title=${TITLE}::One or more jobs failed. Open the failed job; its name is the app and channel."
          exit 1
        fi
