name: dispatch-org-landing
description: Ask the org docs site to refresh release status after this workflow finishes.
inputs:
  token:
    description: Token with Actions write on the site repo. Empty skips the dispatch.
    required: false
    default: ''
  site-repo:
    description: Repository that publishes the org docs site
    required: false
    default: Novolis-Platform/.github
runs:
  using: composite
  steps:
    - name: Dispatch org landing refresh
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        SITE_REPO: ${{ inputs.site-repo }}
        SOURCE: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        if [ -z "${TOKEN}" ]; then
          echo "::warning title=Org landing::No landing token. Set the org secret NOVOLIS_LANDING_TOKEN (Actions write on ${SITE_REPO}) so this run can refresh the docs home."
          exit 0
        fi
        GH_TOKEN="$TOKEN" gh api --method POST "repos/${SITE_REPO}/dispatches" \
          -f event_type=landing-status \
          -f "client_payload[repository]=${SOURCE}" \
          -f "client_payload[html_url]=${RUN_URL}" \
          || {
            echo "::warning title=Org landing::Could not dispatch landing-status on ${SITE_REPO}. The token needs Actions write there."
            exit 0
          }
        echo "Dispatched landing-status on ${SITE_REPO} for ${SOURCE}"
